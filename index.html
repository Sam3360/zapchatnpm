<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>zapchat</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0d1117;
      color: #e6edf3;
    }

    main { text-align: center; padding: 2rem; }

    h1 {
      font-size: 3.5rem;
      font-weight: 800;
      margin-bottom: 2.5rem;
      color: #3fb950;
    }

    .buttons {
      display: flex;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      display: inline-block;
      padding: 0.9rem 2.4rem;
      font-size: 1.1rem;
      font-weight: 600;
      text-decoration: none;
      border-radius: 8px;
      border: 1px solid #30363d;
      transition: transform 0.15s ease, border-color 0.15s ease;
    }

    .btn:hover { transform: translateY(-2px); border-color: #3fb950; }

    .btn-npm { background: #cb3837; color: #fff; border-color: #cb3837; }
    .btn-pypi { background: #3775a9; color: #fff; border-color: #3775a9; }
  </style>
</head>
<body>
  <main>
    <h1>zapchat</h1>
    <nav class="buttons">
      <a class="btn btn-npm" href="https://www.npmjs.com/package/zapchat">npm</a>
      <a class="btn btn-pypi" href="https://pypi.org/project/zapchat/">PyPI</a>
    </nav>
  </main>
</body>
</html>
